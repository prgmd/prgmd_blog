<!DOCTYPE html>
<html class="dark" lang="ko">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>AURORACAMP | Jang Jun Hwan</title>
    
            <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
            <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
            <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-okaidia.min.css" rel="stylesheet" />
            <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
            <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
            <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700&display=swap" rel="stylesheet"/>

    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: { "primary": "#0064fa", "background-dark": "#050505" },
                    fontFamily: { "mono": ["monospace"], "sans": ["Pretendard", "sans-serif"] },
                },
            },
        }
    </script>

    <style type="text/tailwindcss">
        /* 모바일에서 viewport 너비에 비례해 폰트 크기 자동 조정 (데스크탑 ≥ 400px 완전 무영향) */
        html { font-size: clamp(13px, 4vw, 16px); }
        body { font-family: 'Pretendard', sans-serif; -webkit-font-smoothing: antialiased; background-color: #050505; color: white; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #000000; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #333; }
        
        #explorer-panel { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); width: 260px; overflow-x: hidden; }
        .explorer-collapsed { width: 0px !important; opacity: 0; pointer-events: none; transform: translateX(-20px); }

        /* 모바일 반응형 */
        @media (max-width: 768px) {
            #explorer-panel { position: fixed; left: 0; top: 48px; height: calc(100% - 48px); z-index: 100; width: 280px; transform: translateX(-100%); opacity: 0; }
            #explorer-panel.mobile-open { transform: translateX(0); opacity: 1; }
            .explorer-collapsed { transform: translateX(-100%) !important; }
            #explorer-overlay { display: none; position: fixed; inset: 0; top: 48px; background: rgba(0,0,0,0.5); z-index: 99; }
            #explorer-overlay.show { display: block; }
        }

        .section-title { @apply text-sm font-black text-zinc-500 mb-8 tracking-[0.3em] uppercase border-b border-white/10 pb-2 inline-block; }

        /* 스택 배지: 색상 톤다운 (배경 투명, 텍스트에 색상 적용) */
        .stack-badge { @apply flex items-center px-3 py-1 text-sm font-bold rounded-sm transition-opacity hover:opacity-70; }
        
        .history-item { @apply flex gap-4 pb-6 border-l border-white/10 ml-1 pl-6 relative last:pb-0; }
        .history-item::before { content: ''; @apply absolute left-[-4.5px] top-1.5 w-2 h-2 rounded-full bg-zinc-700 border border-background-dark; }
        
        .typing-container { display: inline-block; overflow: hidden; white-space: nowrap; border-right: 2px solid #0064fa; animation: typing 3s steps(33, end) forwards, blink-caret .75s step-end infinite; }
        @keyframes typing { from { max-width: 0 } to { max-width: 100% } }
        @keyframes blink-caret { from, to { border-color: transparent } 50% { border-color: #0064fa; } }
        @media (max-width: 767px) {
            .typing-container { white-space: normal; overflow: visible; max-width: none !important; border-right: none; animation: none; }
        }

        .animate-fadeIn { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .social-badge { @apply flex items-center gap-2 px-5 py-2 border border-white/10 hover:border-primary/50 hover:bg-primary/5 transition-all rounded-full text-[13px] font-bold uppercase tracking-widest; }
        
        /* 아카이브/브리프 카드 */
        .interactive-card { @apply p-4 md:p-6 border border-white/10 bg-zinc-900/10 hover:border-primary/50 hover:bg-zinc-900/30 cursor-pointer transition-all rounded-sm; }

        .explorer-item { @apply flex items-center gap-3 px-5 py-3 text-sm font-medium text-zinc-400 hover:bg-white/5 hover:text-white cursor-pointer transition-colors; }
        .explorer-folder { @apply flex items-center justify-between px-3 py-1.5 text-xs font-bold text-zinc-500 uppercase tracking-widest mt-2 cursor-pointer hover:text-zinc-300; }
        .folder-content { @apply overflow-hidden transition-all duration-300 max-h-0 border-l border-white/5 ml-4; }
        .folder-open { @apply max-h-[1000px]; }
        .rotate-icon { @apply transition-transform duration-300 text-[14px]; }
        .rotated { transform: rotate(90deg); }

        .prose { @apply text-zinc-300 text-base md:text-lg leading-[1.7] md:leading-[1.8]; }
        .prose p { @apply mb-6; }
        .prose strong { @apply font-bold text-white; }
        .prose em { @apply italic text-zinc-400; }
        .prose a { @apply text-primary hover:underline; }
        .prose blockquote { @apply border-l-4 border-zinc-700 pl-4 md:pl-6 py-2 my-4 md:my-6 italic text-zinc-400 text-sm md:text-base; }
        .prose code { @apply bg-zinc-800/80 text-amber-300 font-mono px-1.5 py-1 rounded-md text-sm; }
        .prose img { @apply block mx-auto my-8 rounded-lg shadow-lg max-w-full; }
        .prose h2 { @apply text-xl md:text-2xl font-bold mb-4 md:mb-6 mt-8 md:mt-12 text-white flex items-center gap-2; }
        .prose h2::before { content: ''; @apply w-1.5 h-5 md:h-6 bg-zinc-600 inline-block rounded-full; }
        .prose h3 { @apply text-lg md:text-xl font-bold mb-3 md:mb-4 mt-6 md:mt-8 text-white border-l-2 border-zinc-700 pl-4; }
        .prose h4 { @apply text-lg font-bold mb-3 mt-6 text-white/90; }
        .prose ul { @apply list-disc list-inside ml-4 mb-6 space-y-2; }
        .prose ol { @apply list-decimal list-inside ml-4 mb-6 space-y-2; }
        .prose li { @apply text-zinc-300; }
        .prose pre { @apply bg-[#121212] p-4 md:p-6 rounded-lg md:rounded-xl border border-white/10 my-6 md:my-10 overflow-x-auto shadow-2xl text-sm md:text-base; }
        /* pre 안의 code는 별도 스타일링 */
        .prose pre code { @apply bg-transparent p-0; }
    </style>
</head>
<body class="overflow-hidden h-screen flex flex-col">

<header class="flex items-center justify-between border-b border-white/10 bg-background-dark h-12 shrink-0 z-50 select-none">
    <div class="flex h-full">
        <button onclick="toggleExplorer()" class="flex items-center px-4 border-r border-white/10 hover:bg-white/5 transition-colors text-zinc-400 hover:text-white">
            <span class="material-symbols-outlined">menu</span>
        </button>
        <a href="#" class="flex items-center px-6 border-r border-white/10 hover:opacity-70 transition-opacity">
            <span class="text-white font-black text-sm tracking-tight">AURORACAMP</span>
        </a>
    </div>
</header>

<div class="flex flex-1 overflow-hidden relative">
    <div id="explorer-overlay" onclick="toggleExplorer()"></div>
    <aside id="explorer-panel" class="h-full border-r border-white/10 bg-[#0a0a0a] flex flex-col shrink-0 select-none md:translate-x-0 md:opacity-100">
        <div class="p-4 text-[11px] uppercase font-bold tracking-widest text-zinc-600 border-b border-white/5">Explorer</div>
        <div class="flex-1 overflow-y-auto custom-scrollbar py-2" id="explorer-content"></div>
    </aside>

    <main class="flex-1 flex flex-col bg-background-dark overflow-hidden w-full relative">
                <div class="h-9 border-b border-white/10 flex items-center px-4 bg-zinc-900/20 text-xs text-zinc-500 select-none">
                    <button id="back-btn" onclick="window.history.back()" class="flex items-center justify-center w-6 h-6 mr-2 hover:bg-white/10 rounded transition-colors text-white">
                        <span class="material-symbols-outlined text-sm">chevron_left</span>
                    </button>
                    <span id="breadcrumb"></span>
                </div>
                <div class="flex-1 overflow-y-auto p-4 md:p-12 custom-scrollbar space-y-12 md:space-y-20" id="content-area"></div>
            </main>
        </div>
        
        <script>
            let allPosts = [];
            const techStackGroups = [
                { group: "Cloud", items: [
                    { name: "AWS", color: "#FF9900" },
                    { name: "Terraform", color: "#7B42BC" },
                ]},
                { group: "Container & Automation", items: [
                    { name: "Docker", color: "#2496ED" },
                    { name: "Kubernetes", color: "#326CE5" },
                    { name: "Ansible", color: "#EE0000" },
                    { name: "GitHub Actions", color: "#2088FF" },
                ]},
                { group: "System & Monitoring", items: [
                    { name: "Linux", color: "#E8B000" },
                    { name: "VirtualBox", color: "#2F6FAD" },
                    { name: "Prometheus", color: "#E6522C" },
                    { name: "Grafana", color: "#F46800" },
                ]},
                { group: "Data", items: [
                    { name: "PostgreSQL", color: "#336791" },
                    { name: "MongoDB", color: "#47A248" },
                    { name: "Redis", color: "#DC382D" },
                    { name: "Python", color: "#3776AB" },
                ]},
            ];
            const techStack = techStackGroups.flatMap(g => g.items);
        
            // --- 라우팅 및 렌더링 ---
            async function initBlog() {
                try {
                    const res = await fetch('./posts.json');
                    allPosts = res.ok ? await res.json() : [];
                } catch (e) { allPosts = []; }
                
                renderExplorer();
                
                window.addEventListener('hashchange', () => {
                    handleRouteChange();
                    // 모바일에서 링크 클릭 시 explorer 닫기
                    if (window.innerWidth <= 768) {
                        document.getElementById('explorer-panel').classList.remove('mobile-open');
                        document.getElementById('explorer-overlay').classList.remove('show');
                    }
                });
                handleRouteChange(); // 초기 로딩 시 라우팅 처리
            }
        
            const mainCategories = ['projects', 'learning', 'algorithm'];

            function handleRouteChange() {
                const hash = window.location.hash.substring(1);
                const contentArea = document.getElementById('content-area');

                if (hash.startsWith('post/')) {
                    loadPost(hash.replace('post/', ''));
                } else if (hash.startsWith('archive/')) {
                    const parts = hash.replace('archive/', '').split('/');
                    if (mainCategories.includes(parts[0])) {
                        showCategory(parts[0], parts[1] || null);
                    } else {
                        showArchive(parts[0]);
                    }
                } else {
                    showAbout();
                }
                contentArea.scrollTo(0, 0);
                renderExplorer();
            }
        
            // --- UI 업데이트 ---
            function updateBreadcrumb(pathSegments) {
                const breadcrumbEl = document.getElementById('breadcrumb');
                if (!pathSegments || pathSegments.length === 0) {
                    breadcrumbEl.innerHTML = `<a href="#" class="hover:text-white transition-colors">소개.md</a>`;
                    return;
                }
        
                let html = `<a href="#" class="hover:text-white transition-colors">Home</a>`;

                pathSegments.forEach((segment, index) => {
                    const isLast = index === pathSegments.length - 1;
                    if (isLast) {
                        html += ` <span class="text-zinc-600">/</span> <span class="text-white">${segment}</span>`;
                    } else {
                        html += ` <span class="text-zinc-600">/</span> <a href="#archive/${segment}" class="hover:text-white transition-colors">${segment}</a>`;
                    }
                });
                breadcrumbEl.innerHTML = html;
            }
        
            function renderExplorer() {
                const explorer = document.getElementById('explorer-content');
                const hash = window.location.hash.substring(1);
                const catIcons = { projects: "folder_open", learning: "school", algorithm: "code" };

                const isHome = !hash || hash === '';
                let html = `
                    <a href="#" class="explorer-item mb-1 ${isHome ? 'text-white bg-white/5 border-l-2 border-primary' : ''}">
                        <span class="material-symbols-outlined text-xl">info</span> 소개.md
                    </a>
                `;

                mainCategories.forEach(cat => {
                    const isActive = hash === `archive/${cat}` || (hash.startsWith('post/') && allPosts.find(p => p.id === hash.replace('post/', '') && p.category === cat));
                    html += `
                        <a href="#archive/${cat}" class="explorer-item ${isActive ? 'text-white bg-white/5 border-l-2 border-primary' : ''}">
                            <span class="material-symbols-outlined text-xl">${catIcons[cat]}</span> ${cat.toUpperCase()}
                        </a>
                    `;
                });

                explorer.innerHTML = html;
            }
        
            // --- 페이지 렌더링 함수 ---
            async function loadPost(postId) {
                const post = allPosts.find(p => p.id === postId);
                if (!post) {
                    document.getElementById('content-area').innerHTML = "게시글을 찾을 수 없습니다.";
                    updateBreadcrumb(["404"]);
                    return;
                }
        
                updateBreadcrumb([post.category, post.title]);
        
                try {
                    const res = await fetch(`./files/${post.file}`);
                    const text = await res.text();
                    const cleanText = text.replace(/^---[\s\S]*?---/, '').trim();
                    
                    document.getElementById('content-area').innerHTML = `
                        <article class="max-w-2xl md:max-w-4xl mx-auto w-full animate-fadeIn">
                            <header class="mb-12 border-b border-white/10 pb-8 text-center">
                                <h1 class="text-2xl md:text-5xl font-black text-white tracking-tighter mb-4">${post.title}</h1>
                                <div class="text-sm text-zinc-500">${post.date} • ${(Array.isArray(post.subCategory) ? post.subCategory : [post.subCategory]).join(' · ').toUpperCase()}</div>
                            </header>
                            <div class="prose">${marked.parse(cleanText)}</div>
                        </article>
                    `;
                    Prism.highlightAll();
                } catch (e) {
                    document.getElementById('content-area').innerHTML = "파일 로드 실패";
                }
            }
        
            function filterPosts(subCat) {
                document.querySelectorAll('.filter-btn').forEach(btn => {
                    const active = btn.dataset.sub === subCat;
                    btn.className = `filter-btn px-3 py-1 text-xs rounded-sm border transition-all cursor-pointer active:scale-95 ${
                        active ? 'border-primary/50 text-white bg-primary/10 shadow-[0_0_8px_rgba(0,100,250,0.2)]' : 'border-white/10 text-zinc-400 hover:text-white hover:border-white/40 hover:bg-white/5'
                    }`;
                });
                document.querySelectorAll('#post-list [data-sub]').forEach(item => {
                    item.classList.toggle('hidden', subCat !== '__all__' && !item.dataset.sub.split(',').includes(subCat));
                });
            }

            function showCategory(cat, initialFilter = null) {
                updateBreadcrumb([cat]);
                const posts = allPosts.filter(p => p.category === cat).sort((a, b) => b.date.localeCompare(a.date));
                let subCats = [...new Set(posts.flatMap(p => Array.isArray(p.subCategory) ? p.subCategory : [p.subCategory]))];
                if (cat === 'projects') {
                    ['Digem', 'Blackbox', 'Blog'].forEach(s => !subCats.includes(s) && subCats.push(s));
                    subCats = subCats.filter(s => s !== 'projects');
                }
                if (cat === 'learning') {
                    techStack.forEach(t => !subCats.includes(t.name) && subCats.push(t.name));
                }

                document.getElementById('content-area').innerHTML = `
                    <div class="max-w-2xl md:max-w-4xl mx-auto w-full animate-fadeIn">
                        <h2 class="text-3xl md:text-4xl font-black mb-8 tracking-tighter uppercase text-center">${cat}</h2>

                        <div class="flex flex-wrap gap-2 justify-center mb-8">
                            <button data-sub="__all__" onclick="filterPosts('__all__')"
                                class="filter-btn px-3 py-1 text-xs rounded-sm border transition-all cursor-pointer active:scale-95 border-primary/50 text-white bg-primary/10 shadow-[0_0_8px_rgba(0,100,250,0.2)]">
                                All
                            </button>
                            ${subCats.map(sub => `
                                <button data-sub="${sub}" onclick="filterPosts('${sub}')"
                                    class="filter-btn px-3 py-1 text-xs rounded-sm border transition-all cursor-pointer active:scale-95 border-white/10 text-zinc-400 hover:text-white hover:border-white/40 hover:bg-white/5">
                                    ${sub}
                                </button>
                            `).join('')}
                        </div>

                        <div id="post-list" class="space-y-2">
                            ${posts.length > 0 ? posts.map(p => `
                                <a href="#post/${p.id}" data-sub="${Array.isArray(p.subCategory) ? p.subCategory.join(',') : p.subCategory}" class="interactive-card flex items-center justify-between gap-4">
                                    <div class="flex items-center gap-4 min-w-0">
                                        <span class="text-xs text-white shrink-0">${p.date}</span>
                                        <h4 class="text-base font-bold text-white">${p.title}</h4>
                                    </div>
                                    <span class="text-[11px] px-2 py-0.5 border border-white/20 text-white rounded-sm shrink-0">${Array.isArray(p.subCategory) ? p.subCategory.join(' · ') : p.subCategory}</span>
                                </a>
                            `).join('') : `<p class="text-zinc-500 italic text-center">아직 작성된 글이 없습니다.</p>`}
                        </div>
                    </div>
                `;
                if (initialFilter) filterPosts(initialFilter);
            }

            function showArchive(subCat) {
                updateBreadcrumb([subCat]);
                const filtered = allPosts.filter(p => Array.isArray(p.subCategory) ? p.subCategory.includes(subCat) : p.subCategory === subCat);
                
                document.getElementById('content-area').innerHTML = `
                    <div class="max-w-2xl md:max-w-4xl mx-auto w-full animate-fadeIn">
                        <h2 class="text-3xl md:text-4xl font-black mb-6 md:mb-10 tracking-tighter uppercase text-center">${subCat}</h2>
                        ${filtered.length > 0 ? `
                            <div class="grid grid-cols-1 gap-4">
                                ${filtered.map(p => `
                                    <a href="#post/${p.id}" class="interactive-card">
                                        <p class="text-xs text-zinc-400 mb-2">${p.date}</p>
                                        <h3 class="text-xl font-bold text-white">${p.title}</h3>
                                    </a>
                                `).join('')}
                            </div>
                        ` : `<p class="text-zinc-500 italic text-center">아직 작성된 글이 없습니다.</p>`}
                    </div>
                `;
            }
        
            function showAbout() {
                updateBreadcrumb(null);
                document.getElementById('content-area').innerHTML = `
                    <div class="max-w-2xl mx-auto w-full animate-fadeIn space-y-16 md:space-y-24">

                        <section class="text-center">
                            <h1 class="text-4xl md:text-6xl font-black uppercase tracking-tighter mb-6">JANG JUN HWAN</h1>
                            <p class="text-zinc-400 text-xl italic mb-8"><span class="typing-container">클라우드 인프라와 데이터 엔지니어링을<br class="sm:hidden"> 공부하는 장준환입니다.</span></p>
                            <div class="flex flex-wrap gap-4 justify-center mb-8">
                                <a href="https://github.com/prgmd" target="_blank" class="social-badge"><span class="material-symbols-outlined text-sm">code</span> GitHub</a>
                                <a href="https://solved.ac/profile/trackcamp" target="_blank" class="social-badge"><span class="material-symbols-outlined text-sm">verified</span> Solved.ac</a>
                            </div>
                            <div class="max-w-xs mx-auto p-4 border border-white/10 bg-zinc-900/10 rounded-lg">
                                <img src="http://mazandi.herokuapp.com/api?handle=trackcamp&theme=dark" class="w-full opacity-70">
                            </div>
                        </section>

                        <section>
                            <div onclick="toggleSection('timeline')" class="flex items-center justify-between cursor-pointer pb-2 border-b border-white/10 select-none">
                                <span class="text-sm font-black text-zinc-500 tracking-[0.3em] uppercase">Timeline</span>
                                <span id="ico-timeline" class="text-zinc-500 text-base" style="transition: transform 0.3s ease; display: inline-block; transform: rotate(90deg)">▶</span>
                            </div>
                            <div id="sec-timeline" data-open="true" style="max-height: 2000px; overflow: hidden; transition: max-height 0.35s ease">
                                <div class="mt-8 space-y-6 max-w-lg mx-auto pb-2">
                                    <div class="flex flex-col sm:flex-row sm:items-start gap-1 sm:gap-6">
                                        <p class="text-xs text-zinc-500 sm:text-sm sm:text-zinc-400 sm:shrink-0 sm:w-36 sm:text-right sm:pt-0.5">2017.03 ~ 2024.02</p>
                                        <div>
                                            <h4 class="text-sm sm:text-base font-bold leading-snug">건국대학교</h4>
                                            <p class="text-xs sm:text-sm text-zinc-400 mt-0.5">스마트운행체공학과 학사 졸업</p>
                                        </div>
                                    </div>
                                    <div class="flex flex-col sm:flex-row sm:items-start gap-1 sm:gap-6">
                                        <p class="text-xs text-zinc-500 sm:text-sm sm:text-zinc-400 sm:shrink-0 sm:w-36 sm:text-right sm:pt-0.5">2024.03 ~ 2024.11</p>
                                        <div>
                                            <h4 class="text-sm sm:text-base font-bold leading-snug">CJ ENM</h4>
                                            <p class="text-xs sm:text-sm text-zinc-400 mt-0.5">아티스트 사업부 · 데이터 분석</p>
                                        </div>
                                    </div>
                                    <div class="flex flex-col sm:flex-row sm:items-start gap-1 sm:gap-6">
                                        <p class="text-xs text-zinc-500 sm:text-sm sm:text-zinc-400 sm:shrink-0 sm:w-36 sm:text-right sm:pt-0.5">2025.04 ~ 2025.11</p>
                                        <div>
                                            <h4 class="text-sm sm:text-base font-bold leading-snug">현대오토에버</h4>
                                            <p class="text-xs sm:text-sm text-zinc-400 mt-0.5">모빌리티 SW 스쿨 2기</p>
                                        </div>
                                    </div>
                                    <div class="flex flex-col sm:flex-row sm:items-start gap-1 sm:gap-6">
                                        <p class="text-xs text-zinc-500 sm:text-sm sm:text-zinc-400 sm:shrink-0 sm:w-36 sm:text-right sm:pt-0.5">2026.01 ~ 현재</p>
                                        <div>
                                            <h4 class="text-sm sm:text-base font-bold leading-snug">SSAFY</h4>
                                            <p class="text-xs sm:text-sm text-zinc-400 mt-0.5">삼성 청년 SW 아카데미 15기</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </section>

                        <section>
                            <div onclick="toggleSection('stack')" class="flex items-center justify-between cursor-pointer pb-2 border-b border-white/10 select-none">

                                                ${g.items.map(s => `<span class="stack-badge" style="background-color:${s.color}18; color:${s.color}; border: 1px solid ${s.color}40;">${s.name}</span>`).join('')}

                                        </div>

                        <section>
                            <div onclick="toggleSection('projects')" class="flex items-center justify-between cursor-pointer pb-2 border-b border-white/10 select-none">

                                <span id="ico-projects" class="text-zinc-500 text-base" style="transition: transform 0.3s ease; display: inline-block; transform: rotate(90deg)">▶</span>
                            </div>
                            <div id="sec-projects" data-open="true" style="max-height: 2000px; overflow: hidden; transition: max-height 0.35s ease">
                                <div class="mt-4 space-y-3 pb-2">
                                    <a href="#archive/projects/Digem" class="interactive-card flex items-center gap-6 py-5">
                                        <span class="material-symbols-outlined text-4xl text-zinc-500 shrink-0">music_note</span>
                                        <div class="flex-1 min-w-0">
                                            <h4 class="text-white font-bold text-base tracking-tight mb-2">Digem</h4>
                                            <p class="text-base text-zinc-500">음악 메타데이터 수집 사이트</p>
                                        </div>
                                        <span class="material-symbols-outlined text-zinc-700 text-xl shrink-0">chevron_right</span>

                                    <a href="#archive/projects/Blackbox" class="interactive-card flex items-center gap-6 py-5">
                                        <span class="material-symbols-outlined text-4xl text-zinc-500 shrink-0">videocam</span>

                                            <h4 class="text-white font-bold text-base tracking-tight mb-2">Cloud Blackbox</h4>
                                            <p class="text-base text-zinc-500">클라우드 기반 영상 실시간 저장 및 스트리밍 서비스</p>

                                        <span class="material-symbols-outlined text-zinc-700 text-xl shrink-0">chevron_right</span>
                                    </a>
                                </div>
                            </div>
                        </section>

                    </div>
                `;
            }
        
            // --- 유틸리티 ---
            function toggleSection(id) {
                const content = document.getElementById('sec-' + id);
                const icon = document.getElementById('ico-' + id);
                const isOpen = content.dataset.open === 'true';
                content.style.maxHeight = isOpen ? '0px' : content.scrollHeight + 'px';
                icon.style.transform = isOpen ? 'rotate(0deg)' : 'rotate(90deg)';
                content.dataset.open = isOpen ? 'false' : 'true';
            }

            function toggleExplorer() {
                const panel = document.getElementById('explorer-panel');
                const overlay = document.getElementById('explorer-overlay');
                if (window.innerWidth <= 768) {
                    panel.classList.toggle('mobile-open');
                    overlay.classList.toggle('show');
                } else {
                    panel.classList.toggle('explorer-collapsed');
                }
            }
            function toggleFolder(fId, iId) {
                document.getElementById(fId).classList.toggle('folder-open');
                document.getElementById(iId).classList.toggle('rotated');
            }
        
            initBlog();
        </script>
